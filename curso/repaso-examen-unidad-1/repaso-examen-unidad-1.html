<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recall SBOK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: una sola pantalla que ocupa todo el viewport. Barra fina arriba, escenario central de una columna (≤ 860px) y barra de atajos abajo. */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --ink: #12141A;
  --muted: #5B6271;
  --line: #DADDE5;
  --soft: #E9EBF0;
  --accent: #2B45D4;
  --accent-soft: #E4E8FB;
  --on-accent: #FFFFFF;
  --ok: #157347;
  --ok-soft: #E1F2E8;
  --bad: #BF3328;
  --bad-soft: #FAE6E3;
  --f-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F13; --surface: #15181E; --ink: #E7E9EE; --muted: #99A0AD; --line: #272B34; --soft: #1C2028;
    --accent: #8394FF; --accent-soft: #1E2547; --on-accent: #0D0F13;
    --ok: #45C58A; --ok-soft: #12291E; --bad: #FF7A6B; --bad-soft: #2E1614;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F13; --surface: #15181E; --ink: #E7E9EE; --muted: #99A0AD; --line: #272B34; --soft: #1C2028;
  --accent: #8394FF; --accent-soft: #1E2547; --on-accent: #0D0F13;
  --ok: #45C58A; --ok-soft: #12291E; --bad: #FF7A6B; --bad-soft: #2E1614;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; }

/* Barra superior */
.bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand {
  display: flex; align-items: baseline; gap: 8px; background: none; border: 0; padding: 4px 0; cursor: pointer;
  font: 600 15px/1 var(--f-ui); letter-spacing: -0.01em;
}
.brand small { font: 500 11px/1 var(--f-mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.crumb { font: 500 12px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.spacer { flex: 1; }
.meter { font: 500 13px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 14px; }
.meter b { color: var(--ink); font-weight: 500; }
.meter .t-warn { color: var(--bad); }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  height: 32px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  font: 500 12px/1 var(--f-mono); color: var(--muted);
}
.icon-btn:hover { color: var(--ink); border-color: var(--muted); }

.progress { height: 3px; background: var(--soft); }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

/* Escenario */
.stage { overflow-y: auto; overflow-x: hidden; }
.wrap {
  max-width: 860px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; justify-content: center; gap: 24px;
  padding-block: 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap.top { justify-content: flex-start; }

.eyebrow { font: 500 12px/1.3 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; display: flex; gap: 10px; flex-wrap: wrap; }
.eyebrow .tag { color: var(--accent); }
.eyebrow .case { color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
h1 { font: 650 clamp(30px, 4.6vw, 46px)/1.08 var(--f-ui); letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; font-size: 17px; }
.q { font: 560 clamp(21px, 2.6vw, 29px)/1.32 var(--f-ui); letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.ref { font: 500 12px/1 var(--f-mono); color: var(--muted); }

/* Home: lista de modos */
.modes { display: grid; border-top: 1px solid var(--line); }
.mode {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 16px;
  padding: 18px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer;
}
.mode:hover { background: var(--surface); }
.mode .k { font: 500 13px/1 var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; width: 28px; height: 28px; display: grid; place-items: center; }
.mode:hover .k { border-color: var(--accent); color: var(--accent); }
.mode .t { font: 600 19px/1.2 var(--f-ui); letter-spacing: -0.01em; }
.mode .d { color: var(--muted); font-size: 14.5px; margin-top: 3px; }
.mode .n { font: 500 13px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.mode > div { min-width: 0; }

.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-h h2 { font: 600 13px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: 500 13px/1 var(--f-mono); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; cursor: pointer;
  font-size: 13.5px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center;
}
.chip i { font-style: normal; font: 500 11px/1 var(--f-mono); color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] i { color: var(--bg); opacity: .7; }

.mastery { width: 100%; border-collapse: collapse; font-size: 14px; }
.mastery th { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); text-align: left; padding: 0 8px 8px 0; font-weight: 500; }
.mastery td { padding: 9px 8px 9px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: middle; }
.mastery td.num { font-family: var(--f-mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.bar-mini { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar-mini i { display: block; height: 100%; background: var(--accent); }
.table-scroll { overflow-x: auto; }

/* Opciones */
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; text-align: left;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px; cursor: pointer;
  font-size: 16.5px; line-height: 1.4; transition: border-color .12s ease, background .12s ease;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font: 500 12px/1 var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; height: 24px; display: grid; place-items: center; margin-top: 1px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { border-color: var(--accent); color: var(--accent); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .k { border-color: var(--ok); color: var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .k { border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.opt.dim { opacity: .55; }

.feedback { border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); padding: 16px 18px; display: grid; gap: 6px; }
.feedback .verdict { font: 600 13px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; }
.feedback .verdict.ok { color: var(--ok); }
.feedback .verdict.bad { color: var(--bad); }
.feedback p { margin: 0; max-width: 68ch; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; cursor: pointer;
  font: 500 15px/1.2 var(--f-ui); display: inline-flex; align-items: center; gap: 10px;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn kbd, .opt kbd { font: 500 11px/1 var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary kbd { color: var(--on-accent); border-color: color-mix(in srgb, var(--on-accent) 45%, transparent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.g1 { border-color: var(--bad); color: var(--bad); }
.btn.g2 { border-color: var(--line); }
.btn.g3 { border-color: var(--ok); color: var(--ok); }

/* Recall */
.answer { border-top: 1px solid var(--line); padding-top: 20px; display: grid; gap: 10px; }
.answer p { margin: 0; font-size: 19px; line-height: 1.5; max-width: 66ch; }
.answer ul { margin: 0; padding-left: 20px; font-size: 18px; line-height: 1.5; display: grid; gap: 4px; }
.think { color: var(--muted); font-size: 15px; margin: 0; }
.boxes { display: flex; gap: 4px; align-items: center; }
.boxes i { width: 18px; height: 4px; border-radius: 2px; background: var(--soft); }
.boxes i.on { background: var(--accent); }

/* Ordenar */
.order-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.order-col { display: grid; gap: 8px; min-width: 0; }
.col-h { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding-bottom: 4px; }
.item {
  display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 15px; line-height: 1.35;
}
.item:hover:not(:disabled) { border-color: var(--accent); }
.item .k { font: 500 12px/1.4 var(--f-mono); color: var(--muted); }
.item.placed .k { color: var(--accent); }
.item.ok { border-color: var(--ok); background: var(--ok-soft); }
.item.bad { border-color: var(--bad); background: var(--bad-soft); }
.item .hint { display: block; font: 500 11.5px/1.3 var(--f-mono); color: var(--bad); margin-top: 4px; }
.slot { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font: 500 12px/1.35 var(--f-mono); color: var(--muted); }
.solution { display: grid; gap: 4px; margin: 0; padding-left: 22px; }

/* Clasificar */
.buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.bucket {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; cursor: pointer; text-align: left;
  display: grid; gap: 6px; font: 600 15px/1.25 var(--f-ui); min-height: 70px; align-content: start;
}
.bucket .k { font: 500 11px/1 var(--f-mono); color: var(--muted); }
.bucket:hover:not(:disabled) { border-color: var(--accent); }
.bucket.ok { border-color: var(--ok); background: var(--ok-soft); }
.bucket.bad { border-color: var(--bad); background: var(--bad-soft); }
.bucket:disabled { cursor: default; }
.flash { font-size: clamp(22px, 3vw, 32px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; margin: 0; text-wrap: balance; }

/* Picker de sets */
.sets { display: grid; border-top: 1px solid var(--line); }
.set { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 14px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; align-items: center; }
.set:hover { background: var(--surface); }
.set b { font-weight: 600; font-size: 16px; }
.set span { color: var(--muted); font-size: 14px; display: block; }
.set em { font: 500 12px/1 var(--f-mono); font-style: normal; color: var(--muted); }
.set > div { min-width: 0; }

/* Resultados */
.score { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.score .big { font: 650 clamp(56px, 9vw, 92px)/1 var(--f-ui); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.score .big small { font-size: .4em; color: var(--muted); letter-spacing: 0; }
.score .meta { font: 500 14px/1.5 var(--f-mono); color: var(--muted); }
.miss { display: grid; gap: 14px; }
.miss-item { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 6px; }
.miss-item .qq { font-weight: 600; }
.miss-item .ans { font-size: 14.5px; }
.miss-item .ans .y { color: var(--bad); }
.miss-item .ans .c { color: var(--ok); }
.miss-item .ex { color: var(--muted); font-size: 14.5px; }
.navdots { display: flex; flex-wrap: wrap; gap: 6px; }
.navdots button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 500 12px/1 var(--f-mono); color: var(--muted); }
.navdots button.done { background: var(--soft); color: var(--ink); }
.navdots button.cur { border-color: var(--accent); color: var(--accent); }

.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

/* Barra de atajos */
.keys {
  display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--line); background: var(--surface);
  font: 500 12px/1.4 var(--f-mono); color: var(--muted);
}
.keys kbd { font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; margin-right: 4px; }

@media (max-width: 640px) {
  .order-grid { grid-template-columns: 1fr; }
  .keys { display: none; }
  .wrap { padding-block: 24px; gap: 20px; }
  .mode { grid-template-columns: 1fr auto; }
  .mode .k { display: none; }
  .meter { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="brand" id="home-btn" type="button" title="Inicio (H)">Recall SBOK <small>Unidad I</small></button>
    <span class="crumb" id="crumb"></span>
    <span class="spacer"></span>
    <span class="meter" id="meter"></span>
    <button class="icon-btn" id="theme-btn" type="button" title="Cambiar tema">Tema</button>
    <button class="icon-btn" id="fs-btn" type="button" title="Pantalla completa (F)">Pantalla completa</button>
  </header>
  <div class="progress"><i id="prog"></i></div>
  <main class="stage" id="stage">
    <div class="wrap" id="view"></div>
  </main>
  <footer class="keys" id="keys"></footer>
</div>

<script>
/* ============================================================
   Banco de contenido. Fuente: Guía del SBOK 4.ª ed. (SCRUMstudy, 2022)
   y formatos del curso (FGAP/EGAP). Las referencias usan la sección del libro.
   ============================================================ */
const TOPICS = {
  marco: "Marco SBOK",
  principios: "Principios",
  org: "Organización",
  just: "Justificación",
  cal: "Calidad",
  cambio: "Cambio",
  riesgo: "Riesgo",
  inicio: "Inicio",
  plan: "Planificación y estimación",
  impl: "Implementación",
  rev: "Revisión y retrospectiva",
  lib: "Liberación",
  curso: "Formatos del curso"
};

/* Tarjetas de recall: [tema, pregunta, respuesta, referencia]. "·" separa elementos de una lista. */
const CARDS = [
  ["marco", "¿En qué tres áreas se divide la Guía del SBOK y qué capítulos ocupa cada una?", "Principios (cap. 2) · Aspectos (caps. 3–7) · Procesos (caps. 8–12) · Los caps. 13–14 tratan el escalamiento", "§1.4"],
  ["marco", "¿Cuántos principios, aspectos y procesos fundamentales define el SBOK?", "6 principios · 5 aspectos · 19 procesos fundamentales en 5 fases", "§1.4"],
  ["marco", "¿Quiénes propusieron el enfoque «rugby» que dio origen a Scrum?", "Hirotaka Takeuchi e Ikujiro Nonaka, a mediados de los 80. El equipo avanza como una unidad, pasando el balón, no como una carrera de relevos.", "§1.1.1"],
  ["marco", "¿Qué indica un asterisco (*) en una entrada, herramienta o salida?", "Que es obligatoria o importante para el éxito. Sin asterisco es opcional.", "§1.4.1"],
  ["marco", "¿Qué se puede adaptar y qué no: principios, aspectos o procesos?", "Los principios no se discuten ni se modifican · Los aspectos y los procesos sí se adaptan al proyecto u organización", "§1.4.2"],
  ["marco", "¿Cuál es el criterio clave para considerar «grande» un proyecto Scrum?", "Que requiera múltiples Scrum Masters o múltiples Product Owners (en la práctica, cuatro o más Equipos Scrum).", "§1.4.5"],
  ["marco", "Scrum vs. gestión tradicional: énfasis, documentación, estilo de proceso y planificación por adelantado.", "Scrum: personas · documentación mínima · iterativo · baja planificación por adelantado · Tradicional: procesos · documentación integral · lineal · alta planificación", "§1.5"],
  ["marco", "Scrum vs. gestión tradicional: liderazgo, medición del rendimiento y retorno de la inversión.", "Scrum: liderazgo colaborativo y servicial · se mide el valor del negocio · ROI al comienzo y a lo largo del proyecto · Tradicional: mando y control · cumplimiento del plan · ROI al final", "§1.5"],

  ["principios", "Nombra los 6 principios de Scrum.", "Control del proceso empírico · Autoorganización · Colaboración · Priorización basada en valor · Time-boxing · Desarrollo iterativo", "§1.4.2"],
  ["principios", "¿Cuáles son las tres ideas del control del proceso empírico?", "Transparencia · Inspección · Adaptación", "§2.3"],
  ["principios", "¿Cuáles son las tres dimensiones de la colaboración?", "Conciencia: conocer el trabajo de los demás · Articulación: dividir el trabajo en unidades, repartirlo y reintegrarlo · Apropiación: adaptar la tecnología a la situación", "§2.5"],
  ["principios", "¿En qué se diferencian cooperación y colaboración?", "Cooperación: el resultado es la suma de esfuerzos individuales. Colaboración: el equipo trabaja junto y combina los aportes de cada uno para producir algo mayor.", "§2.5"],
  ["principios", "¿Qué tres factores se consideran al priorizar el backlog?", "Valor · Riesgo o incertidumbre · Dependencias", "§2.6"],
  ["principios", "Time-boxes de Scrum.", "Sprint: 1 a 4 semanas · Planificación del sprint: 2 h por semana de sprint · Daily Standup: 15 min · Revisión del sprint: 1 h por semana · Retrospectiva del sprint: 1 h por semana", "§2.7.1"],
  ["principios", "¿Cuáles son las tres preguntas del Daily Standup?", "¿Qué he hecho desde la última reunión? · ¿Qué tengo planeado hacer antes de la siguiente reunión? · ¿Qué impedimentos u obstáculos estoy enfrentando?", "§2.7.1"],
  ["principios", "¿Cuáles son los dos objetivos de la reunión de planificación del sprint?", "Definición del objetivo: el PO explica las historias de mayor prioridad y el equipo se compromete (meta del sprint) · Identificación y estimación de tareas: el equipo decide cómo hacerlo", "§2.7.1"],
  ["principios", "Además de ordenar el tiempo, ¿qué evita el time-boxing? ¿Qué riesgo tiene?", "Evita el gold-plating (mejorar de más un elemento). Un time-box arbitrario desmotiva y crea un ambiente tenso.", "§2.7"],
  ["principios", "Beneficios de la autoorganización.", "Compromiso y responsabilidad compartida · Motivación y mejor rendimiento · Ambiente innovador y creativo · Elegir el método mejor y más sencillo", "§2.4.1"],
  ["principios", "Beneficios de la colaboración.", "Se reducen las solicitudes de cambio · Se identifican y mitigan riesgos · Aumenta la eficiencia · Se incorpora la mejora continua", "§2.5.1"],
  ["principios", "Beneficios de la coubicación.", "Las preguntas se contestan rápido · Los problemas se resuelven en el momento · Menos fricción · La confianza se gana más rápido", "§2.5.2"],

  ["org", "Roles principales y roles secundarios de Scrum.", "Principales: Product Owner, Scrum Master y Equipo Scrum · Secundarios: interesados del negocio (cliente, usuarios, patrocinador), Scrum Guidance Body y proveedores", "§1.4.3.1"],
  ["org", "¿Qué diferencia hay entre «Equipo Scrum» y «equipo principal de Scrum»?", "Equipo Scrum: quienes crean los entregables · Equipo principal de Scrum: Product Owner + Scrum Master + Equipo Scrum", "§1.4.3.1"],
  ["org", "Tamaño óptimo del Equipo Scrum.", "De 6 a 10 miembros. Con más de 10 se forman varios Equipos Scrum.", "§3.6.2"],
  ["org", "Responsabilidad central del Product Owner.", "Lograr el máximo valor de negocio · Articular los requisitos del cliente · Mantener la justificación del negocio · Es la voz del cliente", "§1.4.3.1"],
  ["org", "Responsabilidad central del Scrum Master.", "Líder de apoyo y facilitador: asegura un ambiente propicio, enseña Scrum, elimina impedimentos y hace cumplir los procesos.", "§3.5"],
  ["org", "¿Qué es el Scrum Guidance Body (SGB)?", "Un rol opcional: un conjunto de documentos o un grupo de expertos que define objetivos de calidad, regulaciones, seguridad y otros parámetros clave de la organización.", "§1.4.3.1"],
  ["org", "Etapas del modelo de Tuckman.", "Formación · Enfrentamiento · Normalización · Desempeño", "§3.10.1"],
  ["org", "Cuatro técnicas de gestión de conflictos.", "Ganar-ganar (la recomendada) · Perder-ganar · Perder-perder · Ganar-perder (no recomendable en Scrum)", "§3.10.3"],
  ["org", "Estilo de liderazgo preferido en Scrum.", "El liderazgo de apoyo (servant leadership): escucha, empatía, comparte el poder. Es la personificación del Scrum Master.", "§3.10.4"],
  ["org", "Teoría X, Teoría Y y Teoría Z.", "X: los empleados evitan el trabajo → estilo autoritario · Y: son automotivados → estilo participativo · Z: Maslow (deseo de trascender) y Ouchi (estabilidad y seguridad laboral) · En Scrum, los líderes siguen Y y Z", "§3.10.6"],
  ["org", "¿Para qué usa el Scrum Master la pirámide de Maslow?", "Para entender en qué nivel está cada persona, motivarla y ayudarle a ascender en la jerarquía.", "§3.10.5"],
  ["org", "¿Quién selecciona a los miembros del Equipo Scrum?", "Normalmente el Product Owner, en colaboración con el Scrum Master (proceso Formar el Equipo Scrum).", "§1.4.4.1"],

  ["just", "¿En qué concepto se basa la justificación del negocio en Scrum?", "En la entrega basada en el valor (value-driven delivery): entregar resultados, y por tanto valor, lo antes posible.", "§1.4.3.2"],
  ["just", "Fórmula del ROI y ejemplo del libro.", "ROI = (Ingresos − Costo) / Costo · Ej.: (300 000 − 125 000) / 125 000 = 1,4 (140 %)", "§4.5.1"],
  ["just", "Con NPV o IRR, ¿qué proyecto se elige? ¿Importa la duración?", "El de mayor NPV o mayor IRR. La duración no se considera aparte: el tiempo ya está dentro del cálculo.", "§4.5.1"],
  ["just", "Siete factores para determinar la justificación del negocio.", "Razonamiento del proyecto · Necesidades del negocio · Beneficios · Costo de oportunidad · Riesgos mayores · Plazos · Costos", "§4.4.1"],
  ["just", "¿Qué es el costo de oportunidad?", "El valor de la siguiente mejor opción de negocio o proyecto que se descartó en favor del proyecto elegido.", "§4.4.1"],
  ["just", "Tres pasos de la justificación del negocio en el ciclo de vida.", "Evaluar y presentar un caso de negocio · Justificación continua de valor · Confirmar la realización de beneficios", "§4.4.2"],
  ["just", "Categorías del análisis de Kano.", "Atractiva (delighters) · Unidimensional (satisfiers) · Requerida (dissatisfiers) · Indiferente (se elimina)", "§4.5.2"],
  ["just", "¿Qué significa MoSCoW?", "Must: debe tener · Should: debería tener · Could: podría tener · Won't: no tendrá (en prioridad decreciente)", "§4.5.2"],
  ["just", "Fórmulas del análisis del valor ganado (EVA).", "SV = EV − PV · CV = EV − AC · SPI = EV / PV · CPI = EV / AC · % completado = EV / BAC × 100 · Negativo o menor que 1 = atraso o sobrecosto", "§4.6.1"],
  ["just", "¿Qué son las MMF?", "Características mínimas de mercado: van con prioridad alta para liberar cuanto antes y aumentar el ROI.", "§4.5.3"],
  ["just", "¿Qué es el mapeo de historias (Patton, 2005)?", "Un esquema visual que ordena las historias por prioridad y las corta en liberaciones 1, 2, 3…", "§4.5.4"],
  ["just", "¿Quién es el responsable principal de la justificación del negocio?", "El Product Owner. Los demás roles contribuyen.", "§4.3"],

  ["cal", "¿Cómo define el SBOK la calidad?", "Como la capacidad del producto o de los entregables para cumplir los criterios de aceptación y alcanzar el valor de negocio que espera el cliente.", "§1.4.3.3"],
  ["cal", "Criterios de aceptación vs. criterios de terminado (DoD).", "Aceptación: propios de cada historia; los define el PO · DoD: reglas comunes a todas las historias (prueba unitaria, revisión por pares, documentación…) · Para darla por terminada se cumplen ambos", "§5.4"],
  ["cal", "¿Qué pide la definición de listo (DoR)?", "Historias con detalle suficiente · Criterios de aceptación definidos · Documentación de apoyo · Tamaño que quepa en un sprint", "§5.4.2"],
  ["cal", "Tres actividades de la gestión de calidad en Scrum.", "Planificación de calidad · Control de calidad · Garantía de calidad", "§5.5"],
  ["cal", "Garantía de calidad vs. control de calidad.", "Garantía: evaluar procesos y estándares para que sigan siendo relevantes · Control: ejecutar las actividades de calidad planeadas al crear los entregables", "§5.5.2"],
  ["cal", "¿Hasta cuándo puede arrastrarse la deuda técnica?", "No más allá de un sprint.", "§5.5.1"],
  ["cal", "¿Qué es el ciclo PDCA y quién lo propuso?", "Planificar · Hacer · Verificar · Actuar. Deming y Shewhart. Deming lo renombró PDSA: «estudiar» en vez de «verificar».", "§5.5.3"],
  ["cal", "¿Se acepta una historia que cumple el 90 % de sus criterios?", "No. Está terminada o no terminada: si es parcial se rechaza y vuelve al backlog. Solo el PO acepta o rechaza.", "§5.4.5"],

  ["cambio", "¿Quién aprueba los cambios?", "Pequeños: el PO · Por encima de su tolerancia: los interesados del negocio · Sustanciales: la alta gerencia (patrocinador, Portfolio, Program o Chief PO)", "§6.3.1"],
  ["cambio", "¿En qué procesos se aprueban las solicitudes de cambio?", "Desarrollar épicas · Crear el backlog priorizado del producto · Refinar el backlog priorizado del producto", "§6.3.1"],
  ["cambio", "¿Puede cambiar el alcance de un sprint ya iniciado?", "No. Si el cambio es tan importante que el sprint pierde valor sin él, el sprint se termina y se planifica uno nuevo. Si no, entra en un sprint posterior.", "§6.5.1"],
  ["cambio", "¿Cuál es la única excepción a no tocar el alcance del sprint?", "Si el equipo sobrestimó mucho y tiene capacidad de reserva, puede preguntar al PO qué historias adicionales incorporar.", "§6.5.1"],
  ["cambio", "¿Cómo influye el cambio esperado en la duración del sprint?", "Requisitos poco definidos o cambios cercanos: 1 a 3 semanas · Requisitos estables: puede alargarse a 4–6 semanas · Lo habitual es 2–3 semanas, y la duración debe ser consistente", "§6.5.1.1"],

  ["riesgo", "Riesgo vs. problema.", "Riesgo: incertidumbre futura; positiva = oportunidad, negativa = amenaza · Problema: una certeza que ya ocurre; se atiende y no se le estima probabilidad", "§7.3.1"],
  ["riesgo", "Tres factores de la actitud de riesgo.", "Apetito de riesgo · Tolerancia al riesgo · Umbral de riesgo", "§7.3.2"],
  ["riesgo", "Categorías de la función de utilidad.", "Aversión al riesgo · Neutral al riesgo · Búsqueda de riesgos", "§7.3.2"],
  ["riesgo", "Cinco pasos de la gestión de riesgos.", "Identificación · Evaluación · Priorización · Mitigación · Comunicación", "§7.4"],
  ["riesgo", "Técnicas de identificación de riesgos.", "Lecciones aprendidas · Listas de verificación · Listas cortas · Tormenta de ideas · Estructura de desglose de riesgos (RBS) · Entrevistas", "§7.4.1"],
  ["riesgo", "Técnicas de evaluación de riesgos.", "Reunión de riesgos · Árboles de probabilidad · Análisis de Pareto · Matriz de probabilidad e impacto · Valor monetario esperado (EMV)", "§7.4.2"],
  ["riesgo", "Fórmula del valor monetario esperado.", "EMV = impacto monetario × probabilidad · Ej.: $1 000 × 0,5 = $500", "§7.4.2"],
  ["riesgo", "¿Quién es el dueño del riesgo?", "El Product Owner, para los riesgos del negocio. El Equipo Scrum implementa las respuestas durante el sprint.", "§7.4.4"],
  ["riesgo", "¿Qué es un spike basado en riesgo?", "Un experimento intenso de 2 a 3 días (investigación o prototipo) para entender un riesgo, de preferencia al inicio del proyecto.", "§7.4.4"],
  ["riesgo", "¿Qué muestra el Risk Burndown Chart?", "La severidad acumulada del riesgo del proyecto en el tiempo, sprint a sprint. La herramienta preferida para evaluarlo es el EMV.", "§7.4.5"],
  ["riesgo", "¿Qué es el backlog priorizado ajustado al riesgo?", "El backlog que ya incorpora como historias priorizadas los riesgos que se pueden mitigar.", "§7.4.3"],

  ["inicio", "Seis procesos de la fase de inicio.", "Crear la visión del proyecto · Identificar al Scrum Master y a los interesados del negocio · Formar el Equipo Scrum · Desarrollar épicas · Crear el backlog priorizado del producto · Realizar la planificación de la liberación", "§1.4.4.1"],
  ["inicio", "Crear la visión: entrada obligatoria y salidas obligatorias.", "Entrada*: caso de negocio del proyecto · Salidas*: Product Owner identificado y declaración de la visión del proyecto · El acta de constitución y el presupuesto son opcionales", "§8.1"],
  ["inicio", "Herramientas de Crear la visión del proyecto.", "Reunión de la visión del proyecto* · Sesiones JAD · Análisis FODA · Análisis de brecha", "§8.1.2"],
  ["inicio", "Salidas obligatorias de Desarrollar épicas.", "Épicas* · Personajes* (personas ficticias con nombre, foto, edad, ambiente y metas)", "§8.4.3"],
  ["inicio", "Salidas obligatorias de Crear el backlog priorizado del producto.", "Backlog priorizado del producto* · Criterios de terminado* · Definición de listo*", "§8.5.3"],
  ["inicio", "Salidas obligatorias de Realizar la planificación de la liberación.", "Cronograma de planificación de la liberación* · Duración del sprint*", "§8.6.3"],
  ["inicio", "Salidas de Formar el Equipo Scrum.", "Equipo Scrum identificado* · Substitutos · Plan de colaboración · Plan de desarrollo del equipo", "§8.3.3"],

  ["plan", "Seis procesos de planificación y estimación.", "Crear historias de usuario · Estimar historias de usuario · Comprometer historias de usuario · Identificar tareas · Estimar tareas · Actualizar el backlog del sprint", "§1.4.4.2"],
  ["plan", "Formato de historia de usuario en el libro.", "Como <rol o personaje>, yo debería <requerimiento>, a fin de <beneficio>. Responde quién, qué y por qué.", "§9.1"],
  ["plan", "Técnicas de estimación.", "Wideband Delphi (rondas anónimas) · Planning Poker (cartas) · Puño de cinco · Afinidad (tallas de camiseta)", "§9.2.2.1"],
  ["plan", "Puño de cinco: ¿qué significa cada dedo?", "1: en desacuerdo, grandes inquietudes · 2: en desacuerdo, asuntos menores · 3: no estoy seguro, me sumo al consenso · 4: de acuerdo, con asuntos por discutir · 5: totalmente de acuerdo", "§9.2.2.1"],
  ["plan", "¿Qué miden los puntos de historia?", "Tamaño relativo: esfuerzo + complejidad + riesgo, calibrado por cada equipo.", "§9.2"],
  ["plan", "¿Con qué datos se eligen las historias del sprint?", "Prioridad · Estimación · Velocidad del sprint anterior · Duración del sprint", "§9.3"],
  ["plan", "Salidas obligatorias de Comprometer historias de usuario.", "Historias de usuario comprometidas* · Backlog del sprint* · Scrumboard*", "§9.3.3"],
  ["plan", "Columnas básicas del Scrumboard.", "Por hacer · En progreso · Terminada · Variante: una columna «En prueba»", "§9.3.3.3"],
  ["plan", "Burndown vs. burnup.", "Burndown: trabajo pendiente vs. tiempo restante · Burnup: trabajo terminado · El Sprint Burndown Chart es salida* de Actualizar el backlog del sprint", "§9.6.3.3"],

  ["impl", "Tres procesos de la fase de implementación.", "Crear entregables · Realizar el Daily Standup · Refinar el backlog priorizado del producto", "§1.4.4.3"],
  ["impl", "¿Se cancela el Daily Standup si falta alguien?", "No. No se cancela ni se retrasa. Las discusiones largas se hacen después de la reunión.", "§10.2.2.1"],
  ["impl", "¿Qué es la sala de guerra?", "El lugar donde trabaja el equipo coubicado, sin cubículos, con comunicación cara a cara. Ideal para el Daily Standup.", "§10.2.2.3"],
  ["impl", "¿Qué es la lista de impedimentos y dónde aparece?", "El registro de problemas que enfrenta el equipo · Entrada* de Crear entregables y del Daily Standup · Salida* del Daily Standup", "§10.1–10.2"],
  ["impl", "¿Quién conduce el refinamiento del backlog y cuánto adelanta?", "El PO, en reuniones de revisión del backlog con SM, equipo e interesados. Refina lo de los próximos 2 o 3 sprints.", "§6.5.1.2"],

  ["rev", "Dos procesos de la fase de revisión y retrospectiva.", "Demostrar y validar el sprint · Retrospectiva del sprint", "§1.4.4.4"],
  ["rev", "Salida obligatoria de Demostrar y validar el sprint.", "Historias de usuario aceptadas* · Además: historias rechazadas, riesgos actualizados, resultados del valor ganado, cronograma de liberación actualizado", "§11.1.3"],
  ["rev", "¿Qué es ESVP?", "Explorador: quiere aprender todo · Comprador: elige lo que le sirve · Vacacionista: va de turista · Prisionero: asiste por obligación · Se responde de forma anónima al inicio de la retrospectiva", "§11.2.2.2"],
  ["rev", "¿Qué es la lancha rápida (speed boat)?", "Una técnica de retrospectiva: la isla es la visión del proyecto, los «motores» ayudan a llegar y las «anclas» frenan.", "§11.2.2.3"],
  ["rev", "Salida obligatoria de la Retrospectiva del sprint.", "Mejoras accionables acordadas*", "§11.2.3"],

  ["lib", "Dos procesos de la fase de liberación.", "Enviar entregables · Retrospectiva de la liberación (cierra el proyecto)", "§1.4.4.5"],
  ["lib", "Salidas obligatorias de Enviar entregables.", "Acuerdo de entregables funcionales* · Entregables funcionales* · Liberación del producto*", "§12.1.3"],
  ["lib", "Herramienta obligatoria de Enviar entregables.", "Métodos de despliegue organizacional*", "§12.1.2"],

  ["curso", "Secuencia de avances del curso.", "FGAP010 Acta · FGAP020 Registro de Stakeholders · FGAP030 Roles y Prototipos · FGAP040 Épicas · FGAP060 Backlog priorizado + FGAP070 Criterios de terminado · Sprints · FGAP090 Cierre", "Curso, semana 5"],
  ["curso", "Campos de un rol o prototipo (FGAP030).", "Rol · Frecuencia de uso · Experticia con el tema · Proficiencia con computadoras y con el software · Metas · Prototipo (quién es, qué hace, estilo de vida)", "Curso, semana 3"],
  ["curso", "Formatos del docente para épica e historia.", "Épica: Como [rol], yo debería [requerimiento], a fin de [beneficio] · Historia: Como [rol], quiero [funcionalidad], para [beneficio] · El libro usa el primero para historias", "Curso, semana 4"],

  ["principios", 1, "En NewBit no saben si YOLOv8 detectará bien los cascos con poca luz. Deciden probar con un prototipo, mirar los resultados y ajustar. ¿Qué principio aplican?", ["Control del proceso empírico", "Time-boxing", "Priorización basada en valor", "Colaboración"], "Decidir por observación y experimentación (transparencia, inspección, adaptación) cuando no hay una solución clara.", "§2.3"],

  ["principios", 1, "Un developer divide el módulo de alertas en unidades, las reparte con su compañero y luego las integran. ¿Qué dimensión de la colaboración es?", ["Articulación", "Conciencia", "Apropiación", "Adaptación"], "Articulación: distribuir el trabajo en unidades, dividirlo entre el equipo y reintegrarlo.", "§2.5"],

  ["principios", 0, "¿Cuál de estos es un radiador de información según el SBOK?", ["El Scrumboard y el Burndown Chart", "El acta de constitución", "El caso de negocio", "Los contratos aplicables"], "Los radiadores de información hacen visible el progreso del equipo (transparencia).", "§2.3.1"],
  ["principios", 0, "¿Cuál NO es un beneficio de la colaboración según el SBOK?", ["Elimina la necesidad de un Product Owner", "Reduce las solicitudes de cambio", "Ayuda a identificar y mitigar riesgos", "Aumenta la eficiencia"], "Los beneficios son: menos cambios, riesgos mitigados, más eficiencia y mejora continua.", "§2.5.1"],
  ["principios", 1, "El PO de NewBit decide hacer primero la detección de casco porque da más valor y además reduce el riesgo técnico. ¿Qué principio aplica?", ["Priorización basada en valor", "Autoorganización", "Time-boxing", "Colaboración"], "La prioridad considera valor, riesgo o incertidumbre y dependencias.", "§2.6"],

  ["org", 0, "¿Cuáles son los roles principales de Scrum?", ["Product Owner, Scrum Master y Equipo Scrum", "Product Owner, Scrum Master y patrocinador", "Scrum Master, Scrum Guidance Body y proveedores", "Cliente, usuarios y patrocinador"], "Los demás son roles secundarios.", "§1.4.3.1"],
  ["org", 0, "¿Qué rol es opcional y puede ser solo un conjunto de documentos?", ["Scrum Guidance Body", "Chief Product Owner", "Equipo Scrum", "Product Owner"], "El SGB puede ser documentos o un grupo de expertos que definen calidad, regulaciones y seguridad.", "§1.4.3.1"],
  ["org", 0, "¿Cuál es el tamaño óptimo de un Equipo Scrum según el SBOK?", ["De 6 a 10 miembros", "De 3 a 5 miembros", "De 10 a 15 miembros", "Exactamente 9 miembros"], "Lo bastante grande para tener las habilidades y lo bastante pequeño para colaborar.", "§3.6.2"],
  ["org", 1, "Albert es el PO de NewBit y representa la voz del cliente. ¿Cuál es su responsabilidad principal?", ["Lograr el máximo valor de negocio y mantener la justificación del negocio", "Eliminar los impedimentos del equipo", "Crear los entregables", "Facilitar el Daily Standup"], "Eliminar impedimentos y facilitar son del SM; crear entregables es del Equipo Scrum.", "§1.4.3.1"],
  ["org", 1, "Un developer de NewBit no puede usar el servidor con GPU porque TI no le da permisos. ¿Quién debe eliminar ese impedimento?", ["El Scrum Master", "El Product Owner", "El patrocinador", "El mismo developer, sin ayuda"], "El SM elimina los impedimentos y protege al equipo para que tenga un ambiente productivo.", "§3.5"],
  ["org", 0, "El «equipo principal de Scrum» está formado por…", ["Product Owner, Scrum Master y Equipo Scrum", "Solo los developers", "Product Owner y patrocinador", "Scrum Master y Scrum Guidance Body"], "«Equipo Scrum» son los que crean entregables; el equipo principal suma al PO y al SM.", "§1.4.3.1"],
  ["org", 1, "Un equipo nuevo tiene conflictos de poder y confusión sobre quién hace qué. ¿En qué etapa de Tuckman está?", ["Enfrentamiento", "Formación", "Normalización", "Desempeño"], "Enfrentamiento: el equipo intenta trabajar, pero hay conflictos de poder y caos.", "§3.10.1"],
  ["org", 1, "El equipo ya resolvió sus diferencias y empieza a encontrar cómo trabajar junto; es un período de ajuste. ¿Etapa de Tuckman?", ["Normalización", "Desempeño", "Enfrentamiento", "Formación"], "Normalización: el equipo madura y resuelve sus diferencias.", "§3.10.1"],
  ["org", 1, "Un developer siente que no valoran sus ideas y termina aceptando todo aunque no esté de acuerdo. ¿Qué enfoque de conflicto es?", ["Perder-ganar", "Ganar-ganar", "Perder-perder", "Ganar-perder"], "Perder-ganar: deja de contribuir y acepta lo que le piden.", "§3.10.3.2"],
  ["org", 1, "El Scrum Master impone su punto de vista sin escuchar al equipo. ¿Qué enfoque de conflicto es?", ["Ganar-perder, no recomendable en Scrum", "Ganar-ganar", "Perder-ganar", "Perder-perder"], "Actuar como manager de facto e imponer criterio es competitivo y choca con la autoorganización.", "§3.10.3.4"],
  ["org", 1, "Para cerrar una discusión cada parte cede algo y queda una solución subóptima. ¿Qué enfoque es?", ["Perder-perder", "Ganar-ganar", "Ganar-perder", "Perder-ganar"], "Negociar soluciones parciales o temporales «dando para recibir» es perder-perder.", "§3.10.3.3"],
  ["org", 0, "¿Qué técnica de gestión de conflictos recomienda el SBOK?", ["Ganar-ganar", "Ganar-perder", "Perder-perder", "Evitar el conflicto"], "Enfrentar el problema con cooperación y diálogo hasta lograr consenso.", "§3.10.3.1"],
  ["org", 1, "Un líder deja al equipo sin supervisión y no interviene en nada; aparece la anarquía. ¿Qué estilo es?", ["Laissez faire", "Líder que delega", "Líder de apoyo", "Líder asertivo"], "El laissez faire no interfiere en las actividades diarias y suele llevar a la anarquía.", "§3.10.4"],
  ["org", 1, "Un gerente asume que los developers evitarán trabajar si nadie los vigila. ¿Qué teoría aplica?", ["Teoría X, incompatible con Scrum", "Teoría Y", "Teoría Z de Ouchi", "Liderazgo de apoyo"], "Es improbable que un proyecto Scrum tenga éxito con líderes de Teoría X.", "§3.10.6"],
  ["org", 0, "¿Qué teorías deben seguir los líderes de proyectos Scrum?", ["Teoría Y y Teoría Z", "Solo la Teoría X", "Teoría X y Teoría Y", "Ninguna en particular"], "Ven a las personas como activos importantes y las empoderan.", "§3.10.6"],
  ["org", 0, "¿Quién selecciona normalmente a los miembros del Equipo Scrum?", ["El Product Owner, en colaboración con el Scrum Master", "El patrocinador", "El Scrum Guidance Body", "Los interesados del negocio"], "Ocurre en el proceso Formar el Equipo Scrum.", "§1.4.4.1"],
  ["org", 0, "Los interesados del negocio incluyen a…", ["Clientes, usuarios y patrocinadores", "PO, SM y Equipo Scrum", "Solo los proveedores", "El Scrum Guidance Body"], "Es un término colectivo; son un subconjunto de los interesados del proyecto.", "§1.4.3.1"],
  ["org", 1, "Un Equipo Scrum tiene 14 personas. ¿Qué recomienda el SBOK?", ["Formar varios Equipos Scrum", "Mantenerlo así para ganar velocidad", "Prescindir del Scrum Master", "Duplicar la duración del sprint"], "Con más de 10 personas se forman varios equipos que se coordinan.", "§1.2.1"],
  ["org", 1, "En la planta hay un operario con baja motivación que solo se preocupa por su estabilidad laboral. ¿Qué herramienta usa el SM para entender cómo motivarlo?", ["La jerarquía de necesidades de Maslow", "El modelo de Tuckman", "El análisis de Kano", "El ciclo PDCA"], "El SM identifica en qué nivel de la pirámide está cada persona para motivarla.", "§3.10.5"],

  ["just", 1, "El proyecto cuesta S/ 20 000 y se esperan beneficios de S/ 50 000. ¿Cuál es el ROI?", ["1,5 (150 %)", "2,5 (250 %)", "0,4 (40 %)", "S/ 30 000"], "(50 000 − 20 000) / 20 000 = 1,5.", "§4.5.1"],
  ["just", 1, "Proyecto A: NPV de $1 500 en 5 años. Proyecto B: NPV de $1 000 en 1 año. ¿Cuál conviene?", ["A, porque su NPV es mayor", "B, porque dura menos", "Son equivalentes", "No se puede decidir sin la IRR"], "El tiempo ya está considerado en el NPV; se elige el mayor.", "§4.5.1"],
  ["just", 1, "Proyecto A: IRR de 15 % en 5 años. Proyecto B: IRR de 10 % en 1 año. ¿Cuál conviene?", ["A, porque su IRR es mayor", "B, porque dura menos", "Ninguno", "Son equivalentes"], "Igual que con el NPV, la duración ya está incluida en el cálculo.", "§4.5.1"],
  ["just", 1, "El valor de la mejor alternativa que la empresa descartó para financiar NewBit se llama…", ["Costo de oportunidad", "Costo hundido", "Valor presente neto", "Valor ganado"], "Es uno de los 7 factores de la justificación del negocio.", "§4.4.1"],
  ["just", 0, "¿Quién es el principal responsable de la justificación del negocio?", ["El Product Owner", "El Scrum Master", "El Equipo Scrum", "El Scrum Guidance Body"], "Los demás roles contribuyen, pero el responsable es el PO.", "§4.3"],
  ["just", 1, "PV = 200 000, EV = 100 000, AC = 300 000. ¿Cuánto valen SPI y CPI?", ["SPI = 0,5 y CPI = 0,33", "SPI = 2 y CPI = 3", "SPI = 0,33 y CPI = 0,5", "SPI = −100 000 y CPI = −200 000"], "SPI = EV/PV = 0,5; CPI = EV/AC = 0,33. Las variaciones (SV, CV) son las restas.", "§4.6.1"],
  ["just", 1, "EV = 40 000, PV = 50 000, AC = 45 000. ¿Cómo va el proyecto?", ["Atrasado y por encima del presupuesto", "Adelantado y bajo el presupuesto", "Atrasado pero bajo el presupuesto", "A tiempo y en presupuesto"], "SV = EV − PV = −10 000 (atraso); CV = EV − AC = −5 000 (sobrecosto).", "§4.6.1"],
  ["just", 1, "BAC = 400 000 y EV = 100 000. ¿Qué porcentaje del proyecto está completado?", ["25 %", "40 %", "75 %", "50 %"], "% completado = EV / BAC × 100.", "§4.6.1"],
  ["just", 1, "Se le da al cliente dinero falso por el monto del presupuesto para que lo reparta entre las historias. ¿Qué técnica es?", ["Dinero de Monopoly", "Método de los 100 puntos", "MoSCoW", "Análisis de Kano"], "El cliente prioriza según lo que estaría dispuesto a pagar por cada historia.", "§4.5.2"],
  ["just", 1, "En NewBit el cliente reparte 100 puntos entre las 12 historias. ¿Qué técnica es y de quién?", ["Método de los 100 puntos, de Leffingwell y Widrig", "Planning Poker, de Grenning", "Puño de cinco, de SCRUMstudy", "Dinero de Monopoly, de Kano"], "Es una técnica de priorización (no de estimación).", "§4.5.2"],
  ["just", 1, "La cámara en el celular sorprendía al inicio; hoy, si falta, el cliente se molesta. ¿Cómo se movió en Kano?", ["De atractiva a requerida", "De requerida a atractiva", "De indiferente a unidimensional", "No cambió de categoría"], "Con el tiempo las características bajan en la clasificación: lo que deleitaba pasa a esperarse.", "§4.5.2"],
  ["just", 0, "En el análisis de Kano, una característica que no afecta en nada al cliente…", ["Es indiferente y debe eliminarse", "Es atractiva", "Es unidimensional", "Es requerida"], "La calidad indiferente no influye en la satisfacción.", "§4.5.2"],
  ["just", 1, "El cliente marca las 12 historias como prioridad 1. ¿Qué hace el PO?", ["Las prioriza también dentro de esa lista; los esquemas simples tienden a dejar todo en «1»", "Las deja así porque lo pidió el cliente", "Le pide al SM que decida", "Las estima todas con el mismo valor"], "Aun una lista de alta prioridad debe ordenarse de mayor a menor.", "§2.6 · §4.5.2"],
  ["just", 0, "¿Cuál es el orden de MoSCoW de mayor a menor prioridad?", ["Debe, debería, podría, no tendrá", "Podría, debería, debe, no tendrá", "Debe, podría, debería, no tendrá", "No tendrá, podría, debería, debe"], "Must, Should, Could, Won't.", "§4.5.2"],
  ["just", 0, "¿Qué técnica ubica las historias por prioridad y las corta en liberaciones 1, 2 y 3?", ["Mapeo de historias", "Mapeo de flujo de valor", "Diagrama de flujo acumulado", "Análisis de Kano"], "Formulada por Jeff Patton (2005).", "§4.5.4"],
  ["just", 0, "¿Qué técnica usa diagramas de flujo para eliminar pasos que no agregan valor?", ["Mapeo de flujo de valor", "Mapeo de historias", "Análisis de Pareto", "Árbol de probabilidad"], "Value Stream Mapping, parte de planificar según el valor.", "§4.5.2"],
  ["just", 0, "¿Cuál es el orden de la justificación del negocio en el ciclo de vida?", ["Evaluar y presentar el caso de negocio → Justificación continua de valor → Confirmar la realización de beneficios", "Crear la visión → Desarrollar épicas → Crear el backlog", "Identificar → Evaluar → Mitigar", "Planificar → Hacer → Verificar → Actuar"], "Se evalúa antes del inicio, se valida durante todo el proyecto y se confirma al entregar.", "§4.4.2"],
  ["just", 0, "¿Cuándo se lleva a cabo generalmente el análisis del valor ganado?", ["Al final de cada sprint", "Solo al cierre del proyecto", "En cada Daily Standup", "Antes de redactar el caso de negocio"], "Se hace al terminar las historias y el backlog del sprint.", "§4.6.1"],
  ["just", 0, "¿Qué son las MMF y qué prioridad llevan?", ["Características mínimas de mercado; prioridad alta", "Métricas de mejora futura; prioridad baja", "Mejoras de mantenimiento; sin prioridad", "Modelos de flujo financiero; prioridad media"], "Permiten liberar la primera versión cuanto antes y elevar el ROI.", "§4.5.3"],

  ["cal", 1, "«Toda historia debe tener prueba unitaria, revisión por pares y documentación.» ¿Qué es?", ["Criterios de terminado (DoD)", "Criterios de aceptación", "Definición de listo", "Caso de negocio"], "La DoD son reglas comunes a todas las historias (FGAP070).", "§5.4.3"],
  ["cal", 1, "«La alerta por no usar casco aparece en el panel del supervisor.» ¿Qué es?", ["Un criterio de aceptación de una historia", "La definición de terminado", "La definición de listo", "La declaración de la visión"], "Es propio de una historia y verificable; lo define el PO.", "§5.4.1"],
  ["cal", 1, "Una historia no tiene criterios de aceptación y es demasiado grande para un sprint. ¿Qué pasa?", ["No cumple la definición de listo y todavía no se estima", "Se estima igual con Planning Poker", "Se acepta en la revisión del sprint", "Pasa directo al Scrumboard"], "Solo se estiman historias que cumplen la DoR.", "§5.4.2"],
  ["cal", 1, "En la revisión, una historia cumple 4 de sus 5 criterios y el patrocinador quiere aceptarla. ¿Qué ocurre?", ["Se rechaza: solo el PO acepta y no existe término medio", "Se acepta parcialmente", "La acepta el patrocinador", "Se acepta al 80 %"], "Se recoge la opinión de todos, pero solo el PO tiene la autoridad. Lo parcial vuelve al backlog.", "§5.4.5"],
  ["cal", 0, "¿Quién tiene la autoridad para aceptar o rechazar historias en la revisión del sprint?", ["Solo el Product Owner", "El cliente", "El Scrum Master", "Todos, por votación"], "Los interesados opinan, pero decide el PO.", "§5.4.5"],
  ["cal", 0, "Según el SBOK, ¿hasta cuándo puede llevarse la deuda técnica?", ["No más allá de un sprint", "Hasta la liberación", "Hasta el cierre del proyecto", "Indefinidamente si el PO lo aprueba"], "Con criterios de aceptación y de terminado bien definidos no debe arrastrarse.", "§5.5.1"],
  ["cal", 0, "La garantía de calidad consiste en…", ["Evaluar los procesos y estándares para que sigan siendo relevantes", "Ejecutar las pruebas de cada entregable", "Redactar los criterios de aceptación", "Aprobar las solicitudes de cambio"], "Ejecutar las actividades de calidad planeadas es el control de calidad.", "§5.5.2"],
  ["cal", 0, "¿Quiénes desarrollaron el ciclo PDCA?", ["Deming y Shewhart", "Takeuchi y Nonaka", "Tuckman y Maslow", "Leffingwell y Widrig"], "Deming lo cambió después a PDSA (estudiar).", "§5.5.3"],
  ["cal", 0, "¿Quién establece los criterios mínimos de terminado de todo el portafolio?", ["El Portfolio Product Owner", "El Scrum Master", "El Equipo Scrum", "El Chief Scrum Master"], "Los criterios bajan en cascada: portafolio → programa → proyecto.", "§5.4.4"],
  ["cal", 0, "¿Qué tres actividades componen la gestión de calidad en Scrum?", ["Planificación, control y garantía de calidad", "Identificación, evaluación y mitigación", "Transparencia, inspección y adaptación", "Prueba unitaria, integrada y de aceptación"], "Están interrelacionadas.", "§5.5"],
  ["cal", 0, "¿Cuándo se demuestra generalmente la garantía de calidad?", ["En la reunión de revisión del sprint", "En el Daily Standup", "En la reunión de la visión", "En la retrospectiva de la liberación"], "Un entregable no está completo sin una garantía de calidad adecuada.", "§5.5.2"],

  ["cambio", 1, "A mitad del sprint 2, el gerente de planta pide agregar la detección de guantes. No es urgente. ¿Qué se hace?", ["Se agrega al backlog priorizado para un sprint posterior", "Se mete en el sprint actual", "El SM rechaza el cambio para siempre", "Se cancela el sprint"], "El alcance del sprint no cambia una vez iniciado; el cambio se prioriza para después.", "§6.5.1"],
  ["cambio", 1, "Cambia una norma de seguridad y sin ese cambio el sprint actual no tendría ningún valor. ¿Qué se hace?", ["El PO, tras consultar a los interesados, termina el sprint y se planifica uno nuevo", "Se sigue igual hasta el final", "El equipo decide solo qué hacer", "Se alarga el sprint dos semanas"], "Si el cambio es urgente y el sprint pierde valor, se termina y se replanifica.", "§6.5.1"],
  ["cambio", 1, "A mitad del sprint, el equipo nota que sobrestimó mucho y le sobra capacidad. ¿Qué puede hacer?", ["Preguntar al PO qué historias adicionales incorporar", "Terminar el sprint antes de tiempo", "Esperar sin hacer nada", "Agregar historias por su cuenta"], "Es la única excepción a no modificar el alcance del sprint.", "§6.5.1"],
  ["cambio", 1, "Los requisitos de NewBit todavía son poco claros y se esperan cambios pronto. ¿Qué duración de sprint conviene?", ["Corta, de 1 a 3 semanas", "Larga, de 4 a 6 semanas", "Variable en cada sprint", "8 semanas"], "Con mucho cambio esperado, sprints cortos. Con requisitos estables se puede alargar.", "§6.5.1.1"],
  ["cambio", 0, "Sin un proceso formal, ¿quién aprueba un cambio pequeño sin impacto considerable?", ["El Product Owner", "La alta gerencia", "El Scrum Master", "El Scrum Guidance Body"], "Los cambios grandes suben a interesados del negocio o a la alta gerencia.", "§6.3.1"],
  ["cambio", 0, "¿En qué procesos se discuten y aprueban las solicitudes de cambio?", ["Desarrollar épicas, Crear el backlog y Refinar el backlog", "Realizar el Daily Standup", "Retrospectiva del sprint", "Enviar entregables"], "Luego se priorizan junto a las demás historias.", "§6.3.1"],
  ["cambio", 0, "¿Es recomendable alternar sprints de 3, 2 y 4 semanas?", ["No, la duración del sprint debe ser consistente", "Sí, da flexibilidad", "Solo en proyectos grandes", "Solo si el PO lo decide"], "Cambiar la duración altera la velocidad de referencia del equipo.", "§6.5.1.1"],
  ["cambio", 0, "¿Cuál es el estado de una solicitud de cambio hasta que se obtiene aprobación formal?", ["No aprobada", "Aprobada provisionalmente", "En el backlog del sprint", "Rechazada"], "Permanece como no aprobada hasta la aprobación formal.", "§6.3.1"],

  ["riesgo", 1, "«No se autorizó el financiamiento del servidor.» ¿Qué es?", ["Un problema: ya ocurrió y se atiende", "Un riesgo positivo", "Un riesgo negativo", "Una oportunidad"], "Los problemas son certezas; no se les evalúa probabilidad.", "§7.3.1"],
  ["riesgo", 1, "«Las cámaras de la planta podrían no tener resolución suficiente.» ¿Qué es?", ["Un riesgo (amenaza)", "Un problema", "Una oportunidad", "Un impedimento ya resuelto"], "Es una incertidumbre futura con impacto negativo.", "§7.3"],
  ["riesgo", 1, "Un riesgo tiene probabilidad de 0,4 e impacto de S/ 5 000. ¿Cuál es su valor monetario esperado?", ["S/ 2 000", "S/ 12 500", "S/ 5 400", "S/ 4 600"], "EMV = impacto × probabilidad = 5 000 × 0,4.", "§7.4.2"],
  ["riesgo", 1, "En la matriz de probabilidad e impacto, un riesgo tiene probabilidad 0,5 e impacto 0,6. ¿Cuál es su puntuación?", ["0,3", "1,1", "0,83", "0,1"], "Se multiplican: 0,5 × 0,6 = 0,3.", "§7.4.2"],
  ["riesgo", 1, "Un interesado no acepta ningún riesgo, sin importar el beneficio. ¿Qué categoría de la función de utilidad es?", ["Aversión al riesgo", "Neutral al riesgo", "Búsqueda de riesgos", "Umbral alto de riesgo"], "Neutral: le da igual; búsqueda: acepta riesgo por un beneficio marginal.", "§7.3.2"],
  ["riesgo", 0, "¿Cuál es el orden de los pasos de la gestión de riesgos?", ["Identificación, evaluación, priorización, mitigación y comunicación", "Evaluación, identificación, mitigación, priorización y comunicación", "Identificación, mitigación, evaluación, comunicación y priorización", "Comunicación, identificación, evaluación, priorización y mitigación"], "Se repiten de forma iterativa durante el proyecto.", "§7.4"],
  ["riesgo", 1, "El equipo agrupa los riesgos de NewBit en técnicos, financieros y de seguridad. ¿Qué herramienta usa?", ["Estructura de desglose de riesgos (RBS)", "Análisis de Pareto", "Árbol de probabilidad", "Lista corta de riesgos"], "La RBS agrupa los riesgos por categorías.", "§7.4.1"],
  ["riesgo", 1, "Antes de crear el backlog, el equipo dedica 2 a 3 días a un prototipo para saber si el modelo corre sin internet. ¿Qué es?", ["Un spike basado en riesgo", "Un sprint cero", "Una sesión JAD", "Una sala de guerra"], "Es un experimento corto para entender un riesgo potencial; se agrega al backlog.", "§7.4.4"],
  ["riesgo", 0, "¿Quién es el dueño del riesgo en Scrum?", ["El Product Owner", "El Scrum Master", "El Equipo Scrum", "El Scrum Guidance Body"], "El equipo implementa las respuestas durante el sprint.", "§7.4.4"],
  ["riesgo", 0, "¿Qué gráfica comunica la severidad acumulada de los riesgos sprint a sprint?", ["Risk Burndown Chart", "Sprint Burndown Chart", "Diagrama de flujo acumulado", "Scrumboard"], "Se construye preferentemente con el EMV.", "§7.4.5"],
  ["riesgo", 0, "¿Qué técnica evalúa los riesgos por magnitud para atender primero el de mayor impacto?", ["Análisis de Pareto", "Estructura de desglose de riesgos", "Tormenta de ideas", "Listas de verificación"], "Las otras tres son de identificación.", "§7.4.2"],
  ["riesgo", 0, "¿Cuál NO es una técnica de identificación de riesgos?", ["Valor monetario esperado", "Tormenta de ideas", "Listas de verificación", "Entrevistas"], "El EMV es una técnica de evaluación.", "§7.4.1"],
  ["riesgo", 0, "Un backlog que incluye como historias los riesgos que se pueden mitigar se llama…", ["Backlog priorizado del producto ajustado al riesgo", "Backlog del sprint", "Lista de impedimentos", "Registro de riesgos"], "Se arma en Crear o Refinar el backlog priorizado.", "§7.4.3"],
  ["riesgo", 0, "¿Cuáles son los tres factores de la actitud de riesgo?", ["Apetito, tolerancia y umbral", "Probabilidad, impacto y proximidad", "Aversión, neutralidad y búsqueda", "Amenaza, oportunidad y problema"], "Aversión/neutral/búsqueda son la función de utilidad; probabilidad/impacto/proximidad, la evaluación.", "§7.3.2"],

  ["inicio", 0, "¿En qué proceso se identifica al Product Owner?", ["Crear la visión del proyecto", "Identificar al Scrum Master y a los interesados del negocio", "Formar el Equipo Scrum", "Desarrollar épicas"], "«Product Owner identificado» es salida obligatoria de Crear la visión.", "§8.1.3"],
  ["inicio", 0, "¿Cuál es la entrada obligatoria de Crear la visión del proyecto?", ["El caso de negocio del proyecto", "El backlog priorizado del producto", "Las épicas", "Los personajes"], "Se revisa el caso de negocio para crear la declaración de la visión.", "§8.1.1"],
  ["inicio", 1, "El equipo de NewBit hace un análisis FODA y un análisis de brecha para definir hacia dónde va el producto. ¿En qué proceso están?", ["Crear la visión del proyecto", "Desarrollar épicas", "Realizar la planificación de la liberación", "Retrospectiva del sprint"], "Sus herramientas: reunión de la visión*, JAD, FODA y análisis de brecha.", "§8.1.2"],

const store = {
  key: "recall-sbok-unidad-1",
  d: { cards: {}, q: {}, topics: Object.keys(TOPICS), theme: null },
  load() {
    try { const raw = localStorage.getItem(this.key); if (raw) Object.assign(this.d, JSON.parse(raw)); } catch (e) {}
    this.d.topics = (this.d.topics || []).filter(t => TOPICS[t]);
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch (e) {} }

const $ = (s, el = document) => el.querySelector(s);
const view = $("#view");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const inTopics = t => store.d.topics.includes(t);
const LETTERS = ["A", "B", "C", "D", "E", "F"];

function setChrome({ crumb = "", meter = "", progress = 0, keys = [] } = {}) {

  $("#keys").innerHTML = [...keys, ...base].map(([k, d]) => `<span><kbd>${esc(k)}</kbd>${esc(d)}</span>`).join("");
}

function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

/* Pantalla completa */
function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
function enterFs() {
  const el = document.documentElement;
  try {
    const p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen && el.webkitRequestFullscreen());
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function toggleFs() {
  if (fsElement()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
  else enterFs();
}
function syncFsLabel() { $("#fs-btn").textContent = fsElement() ? "Salir de pantalla completa" : "Pantalla completa"; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);
$("#fs-btn").addEventListener("click", toggleFs);

/* Tema */
function applyTheme() {
  if (store.d.theme) document.documentElement.setAttribute("data-theme", store.d.theme);
  else document.documentElement.removeAttribute("data-theme");
}
$("#theme-btn").addEventListener("click", () => {
  const dark = store.d.theme ? store.d.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  store.d.theme = dark ? "light" : "dark";
  store.save(); applyTheme();
});
applyTheme();

$("#home-btn").addEventListener("click", home);

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "f" || k === "F") { e.preventDefault(); toggleFs(); return; }
  if (k === "h" || k === "H" || (k === "Escape" && !fsElement())) { e.preventDefault(); home(); return; }
  if (S.onKey && S.onKey(e) === true) e.preventDefault();
});

function counts() {
  return {
    cards: CARDS.filter(c => inTopics(c[0])).length,
    mcq: MCQ.filter(q => inTopics(q[0])).length,
    cases: MCQ.filter(q => inTopics(q[0]) && q[1]).length,
    orders: ORDERS.filter(o => inTopics(o.t)).length,
    sorts: SORTS.filter(s => inTopics(s.t)).length,
    misses: MCQ.filter(q => { const s = store.d.q[q.id]; return inTopics(q[0]) && s && s.last === 0; }).length
  };
}

function topicStats(t) {
  const qs = MCQ.filter(q => q[0] === t);
  let seen = 0, ok = 0;
  qs.forEach(q => { const s = store.d.q[q.id]; if (s) { seen += s.n; ok += s.ok; } });
  const cs = CARDS.filter(c => c[0] === t);
  const known = cs.filter(c => (store.d.cards[c.id] || 0) >= 2).length;
  return { q: qs.length, c: cs.length, acc: seen ? Math.round(ok / seen * 100) : null, known };
}

      ${n.misses ? `<button class="mode" type="button" data-i="5"><span class="k">6</span><div><div class="t">Mis errores</div><div class="d">Solo las preguntas que fallaste la última vez.</div></div><span class="n">${n.misses} pendientes</span></button>` : ""}
    </div>
    <div class="section-h"><h2>Temas incluidos</h2><span><button class="linkish" type="button" id="all-t">Todos</button> · <button class="linkish" type="button" id="none-t">Ninguno</button></span></div>
    <div class="chips">${Object.keys(TOPICS).map(t => `<button class="chip" type="button" data-t="${t}" aria-pressed="${inTopics(t)}">${esc(TOPICS[t])}<i>${MCQ.filter(q => q[0] === t).length + CARDS.filter(c => c[0] === t).length}</i></button>`).join("")}</div>

function emptyState(what) {
  view.className = "wrap";
  view.innerHTML = `<div class="eyebrow">Sin contenido</div><p class="q">No hay ${what} en los temas que elegiste.</p><p class="lede">Activa más temas en el inicio.</p><div class="actions"><button class="btn primary" type="button" id="back">Volver al inicio <kbd>H</kbd></button></div>`;
