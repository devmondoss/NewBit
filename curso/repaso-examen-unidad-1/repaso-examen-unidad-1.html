/* ============================================================
   Recall (tarjetas con autocalificación tipo Leitner)
   ============================================================ */
function startRecall() {
  go("recall");
  const pool = CARDS.filter(c => inTopics(c[0]));
  if (!pool.length) return emptyState("tarjetas");
  const box = c => store.d.cards[c.id] || 0;
  const deck = shuffle(pool).sort((a, b) => box(a) - box(b));
  const R = { deck, total: deck.length, done: 0, shown: false, tally: [0, 0, 0] };
  renderRecall(R);
}

function renderRecall(R) {
  if (!R.deck.length) return recallSummary(R);
  const c = R.deck[0];
  const b = store.d.cards[c.id] || 0;
  const parts = c[2].split(" · ");
  const answer = parts.length > 1 ? `<ul>${parts.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : `<p>${esc(c[2])}</p>`;
  view.className = "wrap";
  view.innerHTML = `
    <div class="eyebrow"><span class="tag">${esc(TOPICS[c[0]])}</span><span>${esc(c[3])}</span><span class="boxes" title="Nivel de dominio">${[0, 1, 2, 3].map(i => `<i class="${i < b ? "on" : ""}"></i>`).join("")}</span></div>
    <p class="q">${esc(c[1])}</p>
    ${R.shown ? `<div class="answer">${answer}</div>` : `<p class="think">Dilo en voz alta o escríbelo antes de mirar.</p>`}
    <div class="actions">
      ${R.shown
        ? `<button class="btn g1" type="button" data-g="0">No lo sabía <kbd>1</kbd></button>
           <button class="btn g2" type="button" data-g="1">Dudé <kbd>2</kbd></button>
           <button class="btn g3" type="button" data-g="2">Lo sabía <kbd>3</kbd></button>`
        : `<button class="btn primary" type="button" id="reveal">Mostrar respuesta <kbd>Espacio</kbd></button>`}
    </div>`;
  const grade = g => {
    const card = R.deck.shift();
    const cur = store.d.cards[card.id] || 0;
    R.tally[g]++;
    if (g === 0) { store.d.cards[card.id] = 0; R.deck.splice(Math.min(3, R.deck.length), 0, card); }
    else if (g === 1) { store.d.cards[card.id] = Math.max(cur, 1); R.done++; }
    else { store.d.cards[card.id] = Math.min(cur + 1, 4); R.done++; }
    store.save();
    R.shown = false; renderRecall(R);
  };
  if (R.shown) view.querySelectorAll("[data-g]").forEach(btn => btn.addEventListener("click", () => grade(+btn.dataset.g)));
  else $("#reveal").addEventListener("click", () => { R.shown = true; renderRecall(R); });
  setChrome({
    crumb: "Recall",
    meter: `<span><b>${R.done}</b>/${R.total}</span><span>sabía <b>${R.tally[2]}</b></span><span>no <b>${R.tally[0]}</b></span>`,
    progress: R.done / R.total * 100,
    keys: R.shown ? [["1", "no lo sabía"], ["2", "dudé"], ["3", "lo sabía"]] : [["Espacio", "mostrar"]]
  });
  S.onKey = e => {
    if (!R.shown && (e.key === " " || e.key === "Enter")) { R.shown = true; renderRecall(R); return true; }
    if (R.shown && ["1", "2", "3"].includes(e.key)) { grade(+e.key - 1); return true; }
  };
}

function recallSummary(R) {
  view.className = "wrap";
  view.innerHTML = `
    <div class="eyebrow">Ronda terminada</div>
    <div class="score"><span class="big">${R.tally[2]}<small> / ${R.total}</small></span><span class="meta">tarjetas que sabías<br>dudaste en ${R.tally[1]} · fallaste ${R.tally[0]} veces</span></div>
    <p class="lede">Las tarjetas que fallaste vuelven primero en la próxima ronda.</p>
    <div class="actions"><button class="btn primary" type="button" id="again">Otra ronda <kbd>Enter</kbd></button><button class="btn" type="button" id="back">Inicio <kbd>H</kbd></button></div>`;
  $("#again").addEventListener("click", startRecall);
  $("#back").addEventListener("click", home);
  setChrome({ crumb: "Recall", progress: 100, keys: [["Enter", "otra ronda"]] });
  S.onKey = e => { if (e.key === "Enter") { startRecall(); return true; } };
}

/* ============================================================
   Marcar (opción múltiple con retroalimentación)
   ============================================================ */
function buildQuestion(q) {
  const opts = shuffle(q[3].map((text, i) => ({ text, ok: i === 0 })));
  return { q, opts, pick: null };
}

function recordAnswer(q, ok) {
  const s = store.d.q[q.id] || { n: 0, ok: 0, last: null };
  s.n++; if (ok) s.ok++; s.last = ok ? 1 : 0;
  store.d.q[q.id] = s; store.save();
}

function startQuiz({ misses = false, cases = false }) {
  go("quiz");
  let pool = MCQ.filter(q => inTopics(q[0]));
  if (misses) pool = pool.filter(q => store.d.q[q.id] && store.d.q[q.id].last === 0);
  if (cases) pool = pool.filter(q => q[1]);
  if (!pool.length) return emptyState("preguntas");
  const weight = q => { const s = store.d.q[q.id]; if (!s) return 1; return s.last === 0 ? 0 : 2; };
  const items = shuffle(pool).sort((a, b) => weight(a) - weight(b)).map(buildQuestion);
  renderQuiz({ items, i: 0, ok: 0, misses, cases });
}

function renderQuiz(Z) {
  if (Z.i >= Z.items.length) return quizSummary(Z);
  const it = Z.items[Z.i];
  const q = it.q;
  const answered = it.pick !== null;
  view.className = "wrap";
  view.innerHTML = `
    <div class="eyebrow"><span class="tag">${esc(TOPICS[q[0]])}</span>${q[1] ? `<span class="case">Casuística</span>` : ""}<span>${esc(q[5])}</span></div>
    <p class="q">${esc(q[2])}</p>
    <div class="opts">${it.opts.map((o, i) => {
      let cls = "";
      if (answered) cls = o.ok ? "ok" : (i === it.pick ? "bad" : "dim");
      return `<button class="opt ${cls}" type="button" data-i="${i}" ${answered ? "disabled" : ""}><span class="k">${LETTERS[i]}</span><span>${esc(o.text)}</span></button>`;
    }).join("")}</div>
    ${answered ? `<div class="feedback"><span class="verdict ${it.opts[it.pick].ok ? "ok" : "bad"}">${it.opts[it.pick].ok ? "Correcto" : "Incorrecto"}</span><p>${esc(q[4])}</p></div>
      <div class="actions"><button class="btn primary" type="button" id="next">${Z.i + 1 < Z.items.length ? "Siguiente" : "Ver resultado"} <kbd>Enter</kbd></button></div>` : ""}
    ${!answered && !Z.misses ? `<label class="toggle"><input type="checkbox" id="only-cases" ${Z.cases ? "checked" : ""}> Solo casuísticas</label>` : ""}
  `;
  const choose = i => {
    if (answered || !it.opts[i]) return;
    it.pick = i;
    const ok = it.opts[i].ok;
    if (ok) Z.ok++;
    recordAnswer(q, ok);
    renderQuiz(Z);
  };
  const next = () => { Z.i++; renderQuiz(Z); };
  view.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.i)));
  if (answered) $("#next").addEventListener("click", next);
  const oc = $("#only-cases");
  if (oc) oc.addEventListener("change", () => startQuiz({ cases: oc.checked }));
  const done = Z.i + (answered ? 1 : 0);
  setChrome({
    crumb: Z.misses ? "Mis errores" : (Z.cases ? "Marcar · casuísticas" : "Marcar"),
    meter: `<span><b>${Z.i + 1}</b>/${Z.items.length}</span><span>aciertos <b>${Z.ok}</b></span>`,
    progress: done / Z.items.length * 100,
    keys: answered ? [["Enter", "siguiente"]] : [["1–4 · A–D", "marcar"]]
  });
  S.onKey = e => {
    if (answered && (e.key === "Enter" || e.key === " " || e.key === "ArrowRight")) { next(); return true; }
    if (!answered) {
      const d = parseInt(e.key, 10);
      if (d >= 1 && d <= it.opts.length) { choose(d - 1); return true; }
      const li = LETTERS.indexOf(e.key.toUpperCase());
      if (li >= 0 && li < it.opts.length) { choose(li); return true; }
    }
  };
}

function quizSummary(Z) {
  const total = Z.items.length;
  const wrong = Z.items.filter(it => it.pick !== null && !it.opts[it.pick].ok);
  view.className = "wrap top";
  view.innerHTML = `
    <div class="eyebrow">Ronda terminada</div>
    <div class="score"><span class="big">${Z.ok}<small> / ${total}</small></span><span class="meta">${Math.round(Z.ok / total * 100)} % de aciertos<br>equivale a ${(Z.ok / total * 20).toFixed(1)} sobre 20</span></div>
    <div class="actions">
      ${wrong.length ? `<button class="btn primary" type="button" id="retry">Repasar mis ${wrong.length} errores <kbd>Enter</kbd></button>` : `<button class="btn primary" type="button" id="again">Otra ronda <kbd>Enter</kbd></button>`}
      <button class="btn" type="button" id="back">Inicio <kbd>H</kbd></button>
    </div>
    ${missList(wrong)}`;
  const again = () => wrong.length ? startQuiz({ misses: true }) : startQuiz({ cases: Z.cases });
  ($("#retry") || $("#again")).addEventListener("click", again);
  $("#back").addEventListener("click", home);
  setChrome({ crumb: "Marcar", progress: 100, keys: [["Enter", wrong.length ? "repasar errores" : "otra ronda"]] });
  S.onKey = e => { if (e.key === "Enter") { again(); return true; } };
}

function missList(items) {
  if (!items.length) return "";
  return `<div class="section-h"><h2>Para repasar</h2></div><div class="miss">${items.map(it => {
    const q = it.q;
    const yours = it.pick === null ? "Sin responder" : it.opts[it.pick].text;
    return `<div class="miss-item"><span class="eyebrow"><span class="tag">${esc(TOPICS[q[0]])}</span><span>${esc(q[5])}</span></span>
      <div class="qq">${esc(q[2])}</div>
      <div class="ans"><span class="y">Tu respuesta: ${esc(yours)}</span><br><span class="c">Correcta: ${esc(q[3][0])}</span></div>
      <div class="ex">${esc(q[4])}</div></div>`;
  }).join("")}</div>`;
}

/* ============================================================
   Selector de secuencias y juegos
   ============================================================ */
function picker(kind) {
  go("picker");
  const list = (kind === "order" ? ORDERS : SORTS).map((x, i) => ({ x, i })).filter(o => inTopics(o.x.t));
  if (!list.length) return emptyState(kind === "order" ? "secuencias" : "juegos");
  const size = x => kind === "order" ? `${x.i.length} pasos` : `${x.i.length} elementos`;
  view.className = "wrap top";
  view.innerHTML = `
    <div class="eyebrow">${kind === "order" ? "Ordenar" : "Clasificar"}</div>
    <p class="q">${kind === "order" ? "Elige qué secuencia armar." : "Elige qué clasificar."}</p>
    <div class="actions"><button class="btn primary" type="button" id="all">Hacer todas seguidas <kbd>Enter</kbd></button></div>
    <div class="sets">${list.map((o, n) => `<button class="set" type="button" data-n="${n}"><div><b>${esc(o.x.n)}</b><span>${esc(TOPICS[o.x.t])} · ${esc(o.x.r)}</span></div><em>${size(o.x)}</em></button>`).join("")}</div>`;
  const start = seq => kind === "order" ? startOrder(seq) : startSort(seq);
  $("#all").addEventListener("click", () => start(list.map(o => o.x)));
  view.querySelectorAll(".set").forEach(b => b.addEventListener("click", () => start([list[+b.dataset.n].x])));
  setChrome({ crumb: kind === "order" ? "Ordenar" : "Clasificar", keys: [["Enter", "todas"]] });
  S.onKey = e => { if (e.key === "Enter") { start(list.map(o => o.x)); return true; } };
}

/* ============================================================
   Ordenar
   ============================================================ */
function startOrder(seq) {
  go("order");
  const O = { seq, k: 0, perfect: 0 };
  loadOrder(O);
}

function loadOrder(O) {
  const set = O.seq[O.k];
  let pool = shuffle(set.i.map((text, idx) => ({ text, idx })));
  if (pool.every((p, n) => p.idx === n) && pool.length > 1) pool = pool.reverse();
  O.pool = pool; O.ans = []; O.checked = false;
  renderOrder(O);
}

function renderOrder(O) {
  const set = O.seq[O.k];
  const n = set.i.length;
  const ready = O.ans.length === n;
  const right = O.checked ? O.ans.filter((a, i) => a.idx === i).length : 0;
  const ansHtml = O.ans.map((a, i) => {
    let cls = "placed", hint = "";
    if (O.checked) { cls = a.idx === i ? "ok" : "bad"; if (a.idx !== i) hint = `<span class="hint">va en la posición ${a.idx + 1}</span>`; }
    return `<button class="item ${cls}" type="button" data-a="${i}" ${O.checked ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(a.text)}${hint}</span></button>`;
  }).join("") + (O.checked ? "" : Array.from({ length: n - O.ans.length }, (_, i) => `<div class="slot">${O.ans.length + i + 1}</div>`).slice(0, 1).join(""));
  const poolHtml = O.pool.map((p, i) => `<button class="item" type="button" data-p="${i}"><span class="k">${i < 9 ? i + 1 : "·"}</span><span>${esc(p.text)}</span></button>`).join("");

  view.className = "wrap";
  view.innerHTML = `
    <div class="eyebrow"><span class="tag">${esc(TOPICS[set.t])}</span><span>${esc(set.r)}</span><span>${O.k + 1} de ${O.seq.length}</span></div>
    <p class="q">${esc(set.n)}</p>
    <p class="lede">${esc(set.p)} Toca los elementos en orden; toca uno de tu lista para devolverlo.</p>
    <div class="order-grid">
      <div class="order-col"><div class="col-h">Disponibles</div>${poolHtml || `<div class="slot">Todo ubicado</div>`}</div>
      <div class="order-col"><div class="col-h">Tu orden</div>${ansHtml}</div>
    </div>
    ${O.checked ? `<div class="feedback"><span class="verdict ${right === n ? "ok" : "bad"}">${right === n ? "Orden perfecto" : right + " de " + n + " en su lugar"}</span>${right === n ? "" : `<ol class="solution">${set.i.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`}</div>` : ""}
    <div class="actions">
      ${O.checked
        ? `<button class="btn" type="button" id="redo">Reintentar <kbd>R</kbd></button><button class="btn primary" type="button" id="next">${O.k + 1 < O.seq.length ? "Siguiente secuencia" : "Terminar"} <kbd>Enter</kbd></button>`
        : `<button class="btn" type="button" id="undo" ${O.ans.length ? "" : "disabled"}>Deshacer <kbd>⌫</kbd></button><button class="btn primary" type="button" id="check" ${ready ? "" : "disabled"}>Comprobar <kbd>Enter</kbd></button>`}
    </div>`;

  const place = i => { if (O.checked || !O.pool[i]) return; O.ans.push(O.pool.splice(i, 1)[0]); renderOrder(O); };
  const unplace = i => { if (O.checked) return; O.pool.push(O.ans.splice(i, 1)[0]); renderOrder(O); };
  const undo = () => { if (O.ans.length) unplace(O.ans.length - 1); };
  const check = () => { if (!ready) return; O.checked = true; if (O.ans.every((a, i) => a.idx === i)) O.perfect++; renderOrder(O); };
  const next = () => { O.k++; if (O.k >= O.seq.length) return orderSummary(O); loadOrder(O); };
  view.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => place(+b.dataset.p)));
  view.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => unplace(+b.dataset.a)));
  if (O.checked) { $("#next").addEventListener("click", next); $("#redo").addEventListener("click", () => loadOrder(O)); }
  else { $("#undo").addEventListener("click", undo); $("#check").addEventListener("click", check); }

  setChrome({
    crumb: "Ordenar",
    meter: `<span><b>${O.k + 1}</b>/${O.seq.length}</span><span>perfectas <b>${O.perfect}</b></span>`,
    progress: (O.k + (O.checked ? 1 : O.ans.length / n)) / O.seq.length * 100,
    keys: O.checked ? [["Enter", "siguiente"], ["R", "reintentar"]] : [["1–9", "elegir"], ["⌫", "deshacer"], ["Enter", "comprobar"]]
  });
  S.onKey = e => {
    if (O.checked) {
      if (e.key === "Enter") { next(); return true; }
      if (e.key === "r" || e.key === "R") { loadOrder(O); return true; }
      return;
    }
    if (e.key === "Backspace") { undo(); return true; }
    if (e.key === "Enter") { check(); return true; }
    const d = parseInt(e.key, 10);
    if (d >= 1 && d <= 9) { place(d - 1); return true; }
  };
}

function orderSummary(O) {
  view.className = "wrap";
  view.innerHTML = `
    <div class="eyebrow">Ordenar · terminado</div>
    <div class="score"><span class="big">${O.perfect}<small> / ${O.seq.length}</small></span><span class="meta">secuencias perfectas<br>al primer intento</span></div>
    <div class="actions"><button class="btn primary" type="button" id="again">Volver a la lista <kbd>Enter</kbd></button><button class="btn" type="button" id="back">Inicio <kbd>H</kbd></button></div>`;
  $("#again").addEventListener("click", () => picker("order"));
  $("#back").addEventListener("click", home);
  setChrome({ crumb: "Ordenar", progress: 100, keys: [["Enter", "lista"]] });
  S.onKey = e => { if (e.key === "Enter") { picker("order"); return true; } };
}

/* ============================================================
   Clasificar
   ============================================================ */
function startSort(seq) {
  go("sort");
  const items = [];
  seq.forEach((set, si) => shuffle(set.i).forEach(it => items.push({ si, text: it[0], b: it[1] })));
  const C = { seq, items, i: 0, ok: 0, pick: null, wrong: [] };
  renderSort(C);
}

function renderSort(C) {
  if (C.i >= C.items.length) return sortSummary(C);
  const it = C.items[C.i];
  const set = C.seq[it.si];
  const answered = C.pick !== null;
  view.className = "wrap";
  view.innerHTML = `
    <div class="eyebrow"><span class="tag">${esc(set.n)}</span><span>${esc(set.r)}</span></div>
    <p class="lede">${esc(set.p)}</p>
    <p class="flash">${esc(it.text)}</p>
    <div class="buckets">${set.b.map((b, i) => {
      let cls = "";
      if (answered) cls = i === it.b ? "ok" : (i === C.pick ? "bad" : "");
      return `<button class="bucket ${cls}" type="button" data-b="${i}" ${answered ? "disabled" : ""}><span class="k">${i + 1}</span>${esc(b)}</button>`;
    }).join("")}</div>
    ${answered && C.pick !== it.b ? `<div class="actions"><button class="btn primary" type="button" id="next">Siguiente <kbd>Enter</kbd></button></div>` : ""}`;
  const next = () => { C.i++; C.pick = null; renderSort(C); };
  const choose = i => {
    if (answered || i >= set.b.length) return;
    C.pick = i;
    if (i === it.b) { C.ok++; renderSort(C); setTimeout(() => { if (S.screen === "sort" && C.items[C.i] === it) next(); }, 650); }
    else { C.wrong.push({ it, set, pick: i }); renderSort(C); }
  };
  view.querySelectorAll("[data-b]").forEach(b => b.addEventListener("click", () => choose(+b.dataset.b)));
  const nb = $("#next"); if (nb) nb.addEventListener("click", next);
  setChrome({
    crumb: "Clasificar",
    meter: `<span><b>${C.i + 1}</b>/${C.items.length}</span><span>aciertos <b>${C.ok}</b></span>`,
    progress: (C.i + (answered ? 1 : 0)) / C.items.length * 100,
    keys: answered ? [["Enter", "siguiente"]] : [[`1–${set.b.length}`, "categoría"]]
  });
  S.onKey = e => {
    if (answered) { if (e.key === "Enter" && C.pick !== it.b) { next(); return true; } return; }
    const d = parseInt(e.key, 10);
    if (d >= 1 && d <= set.b.length) { choose(d - 1); return true; }
  };
}

function sortSummary(C) {
  view.className = "wrap top";
  view.innerHTML = `
    <div class="eyebrow">Clasificar · terminado</div>
    <div class="score"><span class="big">${C.ok}<small> / ${C.items.length}</small></span><span class="meta">${Math.round(C.ok / C.items.length * 100)} % de aciertos</span></div>
    <div class="actions"><button class="btn primary" type="button" id="again">Volver a la lista <kbd>Enter</kbd></button><button class="btn" type="button" id="back">Inicio <kbd>H</kbd></button></div>
    ${C.wrong.length ? `<div class="section-h"><h2>Para repasar</h2></div><div class="miss">${C.wrong.map(w => `<div class="miss-item"><div class="qq">${esc(w.it.text)}</div><div class="ans"><span class="y">Elegiste: ${esc(w.set.b[w.pick])}</span><br><span class="c">Correcto: ${esc(w.set.b[w.it.b])}</span></div></div>`).join("")}</div>` : ""}`;
  $("#again").addEventListener("click", () => picker("sort"));
  $("#back").addEventListener("click", home);
  setChrome({ crumb: "Clasificar", progress: 100, keys: [["Enter", "lista"]] });
  S.onKey = e => { if (e.key === "Enter") { picker("sort"); return true; } };
}

/* ============================================================
   Simulacro: 25 preguntas, 30 minutos, nota vigesimal
   ============================================================ */
function startExam() {
  go("exam");
  const pool = MCQ.filter(q => inTopics(q[0]));
  if (!pool.length) return emptyState("preguntas");
  const cases = shuffle(pool.filter(q => q[1]));
  const plain = shuffle(pool.filter(q => !q[1]));
  const N = Math.min(25, pool.length);
  const nCases = Math.min(cases.length, Math.ceil(N * 0.6));
  const chosen = shuffle([...cases.slice(0, nCases), ...plain.slice(0, N - nCases)]);
  const E = { items: chosen.map(buildQuestion), i: 0, end: Date.now() + 30 * 60 * 1000, over: false };
  S.timer = setInterval(() => tickExam(E), 1000);
  renderExam(E);
}

function timeLeft(E) { return Math.max(0, Math.round((E.end - Date.now()) / 1000)); }
function fmt(s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

function examMeter(E) {
  const left = timeLeft(E);
  const done = E.items.filter(x => x.pick !== null).length;
  return `<span><b>${done}</b>/${E.items.length} respondidas</span><span class="${left < 300 ? "t-warn" : ""}">tiempo <b class="${left < 300 ? "t-warn" : ""}">${fmt(left)}</b></span>`;
}

function tickExam(E) {
  if (S.screen !== "exam") return stopTimer();
  $("#meter").innerHTML = examMeter(E);
  if (timeLeft(E) === 0) finishExam(E);
}

function renderExam(E) {
  const it = E.items[E.i];
  const q = it.q;
  const last = E.i === E.items.length - 1;
  view.className = "wrap";
  view.innerHTML = `
    <div class="eyebrow"><span>Pregunta ${E.i + 1} de ${E.items.length}</span>${q[1] ? `<span class="case">Casuística</span>` : ""}</div>
    <p class="q">${esc(q[2])}</p>
    <div class="opts">${it.opts.map((o, i) => `<button class="opt ${it.pick === i ? "sel" : ""}" type="button" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(o.text)}</span></button>`).join("")}</div>
    <div class="actions">
      <button class="btn" type="button" id="prev" ${E.i ? "" : "disabled"}>Anterior <kbd>←</kbd></button>
      ${last ? "" : `<button class="btn primary" type="button" id="next">Siguiente <kbd>Enter</kbd></button>`}
      <button class="btn ${last ? "primary" : ""}" type="button" id="finish">Entregar examen</button>
    </div>
    <div class="navdots">${E.items.map((x, n) => `<button type="button" data-n="${n}" class="${x.pick !== null ? "done" : ""} ${n === E.i ? "cur" : ""}">${n + 1}</button>`).join("")}</div>`;
  const choose = i => { if (!it.opts[i]) return; it.pick = i; renderExam(E); };
  const move = d => { const n = E.i + d; if (n >= 0 && n < E.items.length) { E.i = n; renderExam(E); } };
  view.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.i)));
  view.querySelectorAll(".navdots button").forEach(b => b.addEventListener("click", () => { E.i = +b.dataset.n; renderExam(E); }));
  $("#prev").addEventListener("click", () => move(-1));
  const nx = $("#next"); if (nx) nx.addEventListener("click", () => move(1));
  const fin = $("#finish");
  fin.addEventListener("click", () => {
    const pending = E.items.filter(x => x.pick === null).length;
    if (pending && !fin.dataset.armed) { fin.dataset.armed = "1"; fin.textContent = `Faltan ${pending}. Entregar igual`; return; }
    finishExam(E);
  });
  setChrome({
    crumb: "Simulacro",
    meter: examMeter(E),
    progress: E.items.filter(x => x.pick !== null).length / E.items.length * 100,
    keys: [["1–4 · A–D", "marcar"], ["← →", "navegar"], ["Enter", "siguiente"]]
  });
  S.onKey = e => {
    const d = parseInt(e.key, 10);
    if (d >= 1 && d <= it.opts.length) { choose(d - 1); return true; }
    const li = LETTERS.indexOf(e.key.toUpperCase());
    if (li >= 0 && li < it.opts.length) { choose(li); return true; }
    if (e.key === "ArrowLeft") { move(-1); return true; }
    if (e.key === "ArrowRight" || e.key === "Enter") { move(1); return true; }
  };
}

function finishExam(E) {
  if (E.over) return;
  E.over = true; stopTimer();
  S.screen = "exam-result";
  const total = E.items.length;
  let ok = 0;
  E.items.forEach(it => { const good = it.pick !== null && it.opts[it.pick].ok; if (good) ok++; if (it.pick !== null) recordAnswer(it.q, good); });
  const wrong = E.items.filter(it => it.pick === null || !it.opts[it.pick].ok);
  const nota = ok / total * 20;
  const used = 30 * 60 - timeLeft(E);
  const byTopic = {};
  E.items.forEach(it => { const t = it.q[0]; byTopic[t] = byTopic[t] || [0, 0]; byTopic[t][1]++; if (it.pick !== null && it.opts[it.pick].ok) byTopic[t][0]++; });
  view.className = "wrap top";
  view.innerHTML = `
    <div class="eyebrow">Simulacro entregado</div>
    <div class="score"><span class="big">${nota.toFixed(1).replace(".", ",")}<small> / 20</small></span><span class="meta">${ok} de ${total} correctas<br>tiempo usado ${fmt(used)}</span></div>
    <p class="lede">${nota >= 17 ? "Listo para el examen. Repasa los fallos y sal." : nota >= 11 ? "Aprobado. Repasa los temas con menos aciertos antes de entrar." : "Todavía no. Haz una ronda de Recall en los temas más bajos y vuelve a intentarlo."}</p>
    <div class="table-scroll"><table class="mastery"><thead><tr><th>Tema</th><th>Aciertos</th><th></th></tr></thead><tbody>
      ${Object.entries(byTopic).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).map(([t, [a, n]]) => `<tr><td>${esc(TOPICS[t])}</td><td class="num">${a}/${n}</td><td style="width:40%"><div class="bar-mini"><i style="width:${a / n * 100}%"></i></div></td></tr>`).join("")}
    </tbody></table></div>
    <div class="actions"><button class="btn primary" type="button" id="again">Otro simulacro <kbd>Enter</kbd></button>${wrong.length ? `<button class="btn" type="button" id="retry">Repasar errores</button>` : ""}<button class="btn" type="button" id="back">Inicio <kbd>H</kbd></button></div>
    ${missList(wrong)}`;
  $("#again").addEventListener("click", startExam);
  const rt = $("#retry"); if (rt) rt.addEventListener("click", () => startQuiz({ misses: true }));
  $("#back").addEventListener("click", home);
  setChrome({ crumb: "Simulacro", progress: 100, keys: [["Enter", "otro simulacro"]] });
  S.onKey = e => { if (e.key === "Enter") { startExam(); return true; } };
}

home();
</script>
